name: Deploy status page to Pages

on:
  # Build and deploy on pushes targeting the default branch
  push:
    branches: ["main"]

  # Build only (no deploy): lets a pull request be previewed by downloading
  # the "github-pages" artifact from the workflow run
  pull_request:

  # Manual run from the Actions tab. Deploys only when run against main.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Single source of truth for the Hugo version: .hugo-version
      # (also used by the Makefile for local builds)
      - name: Install Hugo CLI
        run: |
          HUGO_VERSION="$(tr -d '[:space:]' < .hugo-version)"
          echo "Installing Hugo Extended ${HUGO_VERSION}"
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Check RSS feed
        run: |
          python3 -c 'import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])' public/index.xml
          test "$(grep -c '<item>' public/index.xml)" -gt 0
          grep -q '<category>status:' public/index.xml
          echo "index.xml: $(grep -c '<item>' public/index.xml) items"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deployment job (only for the default branch)
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
